name: Refresh remediation activity
on:
  workflow_run:
    workflows: [Remediate vulnerability]
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  refresh:
    if: >-
      ${{ github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, downloaded artifacts, application execution, or App/API secrets.
      - name: Refresh register and usage after success or failure
        env:
          GH_TOKEN: ${{ github.token }}
          HUB: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh api --method POST "repos/$HUB/actions/workflows/scan.yml/dispatches" -f "ref=$BRANCH"
