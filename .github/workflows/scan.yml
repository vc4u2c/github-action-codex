name: Scan and reconcile register
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: vulnerability-hub-register
  cancel-in-progress: false
  queue: max
jobs:
  scan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: targets
        run: node scripts/target-outputs.mjs
      - name: Mint read-only target token
        if: vars.HUB_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.HUB_APP_ID }}
          private-key: ${{ secrets.HUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.targets.outputs.owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: read
          permission-pull-requests: read
      - name: Audit manifests and reconcile issues
        id: scan
        run: node scripts/scan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ steps.app.outputs.token }}
      - name: Preserve scan evidence and dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerability-dashboard
          path: |
            artifacts/
            site/
          if-no-files-found: warn
      - name: Prepare Pages artifact
        if: always() && steps.scan.outcome != 'skipped' && vars.PUBLISH_DASHBOARD == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  pages:
    needs: scan
    if: always() && needs.scan.result != 'skipped' && vars.PUBLISH_DASHBOARD == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
